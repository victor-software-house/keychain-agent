# signd's version is the VERSION file.
# verctl renders Sources/SigndCLI/Version.swift from it, with the template
# .ctl/templates/Version.swift.jinja, and `signd --version` prints it.
# publisher none releases it on GitHub only.
# The Release workflow attaches signd.pkg to that release.
packages:
  - name: signd
    path: VERSION
    publisher: none

# Maintainers and Apps a changelog never credits.
changelog:
  internal_authors:
    - any-victor
    - "github-actions[bot]"
    - "vsh-changeset-version[bot]"
