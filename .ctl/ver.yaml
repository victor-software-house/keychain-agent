# signd's version is the VERSION file. verctl renders Sources/SigndCLI/Version.swift from it
# through .ctl/templates/Version.swift.jinja, which `signd --version` prints. publisher none
# releases it on GitHub only, and the Release workflow attaches signd.pkg to that release.
packages:
  - name: signd
    path: VERSION
    publisher: none

# Maintainers and Apps a changelog never credits.
changelog:
  internal_authors:
    - any-victor
    - "github-actions[bot]"
    - "vsh-changeset-version[bot]"
