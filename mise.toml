# The latest stable mise is the floor; CI pins the same version.
min_version = "2026.11.6"

[settings]
# Every tool, whether a config file, a task or the command line asks for it,
# comes from the locks; one with no entry fails instead of being looked up.
locked = true
# mise loads git:: task includes, and runs [deps] providers, only in
# experimental mode.
experimental = true
lockfile = true
# The platforms CI and contributors use, from the platforms answer. Without
# it, mise install fills every tool up to the platforms any tool already
# records, and rewrites the locks.
lockfile_platforms = ["linux-x64", "macos-arm64"]

# Every tool this root declares must match mise.lock or mise.<env>.lock.
[tool_config]
locked = true

# mise-tasks/ holds this repository's task fragments and file tasks. An
# includes list replaces the default task dirs, so mise-tasks comes first; add
# pinned git:: catalogs after it.
[task_config]
includes = [
  # Pinned git:: catalogs follow mise-tasks.
  "mise-tasks",
  # template:check, template:off, and template:on, at actions main, 2026-11-17.
  "git::https://github.com/victor-software-house/actions.git//tasks/template.toml?ref=e044bc0a41a1544d2c6a0b368c086392d6d184c9",
  # The q task (qctl v0.7.0), pinned by commit because a tag can move.
  "git::https://github.com/victor-software-house/qctl.git//tasks/q?ref=ea9e838d7af20683930156dee9fdf16cebee5fcb",
  # The ver task (verctl v0.8.5), pinned by commit because a tag can move.
  "git::https://github.com/victor-software-house/verctl.git//tasks/ver?ref=cef779a4ed2ce4705fd25c6ea17a5454d2522adc",
]

# Swift comes from the selected Xcode, which macOS runners and the box hosts carry.
[tasks.build]
description = "Build the Swift package"
run = "swift build"

[tasks.test]
description = "Run the Swift package tests"
run = "swift test"

[tasks.check]
description = "Run the repository checks, then build the package and run its tests, as CI does"
depends = ["check:repo"]
run = ["swift build", "swift test"]

# The release package: the Release workflow runs it on the xcode-27 runner after macos-signing
# has imported both Developer ID identities and the notary key, into a keychain that holds
# only them, so each --sign names the identity by its certificate type. The hardened runtime and the
# Developer ID team are what the keys' partition lists depend on.
[tasks.package]
description = "Build build/keychain-agent.pkg: the release binary signed with the Developer ID, in a signed package, notarized and stapled"
run = [
  "rm -rf build",
  "swift build -c release",
  "mkdir -p build/root/usr/local/bin",
  "ditto \"$(swift build -c release --show-bin-path)/keychain-agent\" build/root/usr/local/bin/keychain-agent",
  "codesign --force --options runtime --timestamp --identifier com.victor-software-house.keychain-agent --sign 'Developer ID Application' build/root/usr/local/bin/keychain-agent",
  "codesign --verify --strict --verbose=2 build/root/usr/local/bin/keychain-agent",
  "pkgbuild --root build/root --install-location / --identifier com.victor-software-house.keychain-agent.pkg --version \"$(cat VERSION)\" build/keychain-agent-component.pkg",
  "productbuild --package build/keychain-agent-component.pkg --sign 'Developer ID Installer' build/keychain-agent.pkg",
  "xcrun notarytool submit build/keychain-agent.pkg --key \"$NOTARY_KEY_PATH\" --key-id \"$NOTARY_KEY_ID\" --issuer \"$NOTARY_ISSUER_ID\" --wait",
  "xcrun stapler staple build/keychain-agent.pkg",
]
