# The latest stable mise is the floor; CI pins the same version.
min_version = "2026.11.10"

[settings]
# Every tool comes from the locks, whether a config file, a task or the command
# line needs it. A tool with no entry fails instead of being looked up.
locked = true
# mise loads git:: task includes, and runs [deps] providers, only in
# experimental mode.
experimental = true
lockfile = true
# The platforms CI and contributors use, from the platforms answer. Without
# it, mise install fills every tool up to the platforms any tool already
# records, and rewrites the locks.
lockfile_platforms = ["linux-x64", "macos-arm64"]

# Every tool this root declares must match mise.lock or mise.<env>.lock.
[tool_config]
locked = true

# mise-tasks/ contains this repository's task fragments and file tasks.
# An includes list replaces the default task dirs, so mise-tasks comes first.
# Add pinned git:: catalogs after it.
[task_config]
includes = [
  # Pinned git:: catalogs follow mise-tasks.
  "mise-tasks",
  # template:check, template:off, and template:on, at actions main, 2026-11-18.
  "git::https://github.com/victor-software-house/actions.git//tasks/template.toml?ref=6243d0aec17b8d3eb664b6cf5162bfb5ef7990c3",
  # The q task (qctl v0.7.0), pinned by commit because a tag can move.
  "git::https://github.com/victor-software-house/qctl.git//tasks/q?ref=ea9e838d7af20683930156dee9fdf16cebee5fcb",
  # The ver task (verctl v0.8.5), pinned by commit because a tag can move.
  "git::https://github.com/victor-software-house/verctl.git//tasks/ver?ref=cef779a4ed2ce4705fd25c6ea17a5454d2522adc",
]

[env]
# signd's iCloud container.
# App/Signd.entitlements derives it from the bundle identifier, and the App ID and the provisioning profile list it.
# The app reads it back from its signature.
# package:profile and package:check compare the profile and the bundle with it, and the CloudKit tasks take it from here.
CLOUDKIT_CONTAINER = "iCloud.com.victor-software-house.signd"

[tools]
# XcodeGen ships macOS builds only, and the Linux jobs install every locked tool.
"aqua:yonaskolb/XcodeGen" = { version = "2.47.0", os = ["macos"] }

# Swift comes from the selected Xcode, which macOS runners and the box hosts carry.
[tasks.build]
description = "Build the Swift package"
run = "swift build"

[tasks.generate]
description = "Write Signd.xcodeproj and App/Info.plist from project.yml; git ignores both"
run = "xcodegen generate"

[tasks.app]
description = "Build the Signd app target unsigned into build/, as a pull request's check does"
depends = ["generate"]
# xcodegen/settings.yml sets the compilation cache for the project's own targets only.
# The Swift package targets take it from the command line, so they share the cache path CI restores.
# The package checkouts go under .build, which the SwiftPM cache of CI restores, instead of build/SourcePackages.
run = '''
xcodebuild build -project Signd.xcodeproj -scheme Signd -derivedDataPath build -clonedSourcePackagesDirPath .build/xcode-packages \
  CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_KEEP_CAS_DIRECTORY=YES \
  COMPILATION_CACHE_CAS_PATH="$HOME/Library/Caches/CompilationCache.noindex"
'''

[tasks.archive]
description = "Archive the Signd scheme in Release into build/Signd.xcarchive, signed manually with the Developer ID identity and the profile package:profile installed"
depends = ["generate"]
# SIGND_TEAM and SIGND_PROFILE_UUID come from package:profile, and project.yml applies them to the Signd target only.
# The version comes from VERSION.
run = [
  "rm -rf build/Signd.xcarchive",
  '''
xcodebuild archive -project Signd.xcodeproj -scheme Signd -configuration Release -archivePath build/Signd.xcarchive \
  OTHER_CODE_SIGN_FLAGS=--timestamp \
  SIGND_TEAM="${SIGND_TEAM:?run package:profile first}" SIGND_PROFILE_UUID="${SIGND_PROFILE_UUID:?run package:profile first}" \
  MARKETING_VERSION="$(cat VERSION)" CURRENT_PROJECT_VERSION="$(cat VERSION)"
''',
]

[tasks.export]
description = "Export build/Signd.xcarchive as the Developer ID Signd.app in build/export"
depends = ["archive", "export:options"]
run = [
  "rm -rf build/export",
  "xcodebuild -exportArchive -archivePath build/Signd.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/export",
]

[tasks.test]
description = "Run the Swift package tests"
run = "swift test"

[tasks.check]
description = "Run the repository checks and the app build, then build the package and run its tests, as CI does"
# app needs Xcode. A documentation-only pull request runs check:local on Linux, so app goes here.
depends = ["check:repo", "app"]
run = ["swift build", "swift test"]

[tasks."cloudkit:schema"]
description = "Validate cloudkit/schema.ckdb and import it into the container's development environment; the CloudKit console deploys it to production"
# cktool reads the management token from CLOUDKIT_MANAGEMENT_TOKEN.
usage = '''
flag "--team-id <team>" env="CLOUDKIT_TEAM_ID" required=#true help="The Apple Developer team that owns the container"
flag "--container <container>" env="CLOUDKIT_CONTAINER" required=#true help="The iCloud container"
'''
run = [
  "xcrun cktool validate-schema --team-id {{usage.team_id}} --container-id {{usage.container}} --environment development --file cloudkit/schema.ckdb",
  "xcrun cktool import-schema --team-id {{usage.team_id}} --container-id {{usage.container}} --environment development --file cloudkit/schema.ckdb",
]
